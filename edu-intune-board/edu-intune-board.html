<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육 보드 · Intune — 기능별 데이터 흐름</title>
<style>
:root{
  --bg:#0e2724; --bg2:#133430; --panel:#173b36; --panel2:#1c4741; --line:#2f6b60; --line2:#265a51;
  --txt:#e8f4f1; --mut:#8fb7ae; --acc:#ff7a45; --blue:#7b95ff; --amb:#f0b64a; --red:#ff5d5d; --grn:#4fd1a5; --tea:#3fb59c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}

/* 상단 */
.top{padding:14px 22px 10px;border-bottom:1px solid var(--line2);background:var(--bg2)}
.top h1{margin:0;font-size:18px;letter-spacing:-.2px}
.top p{margin:4px 0 0;color:var(--mut);font-size:12px}
.steps{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;padding:10px 22px;background:var(--bg2);border-bottom:1px solid var(--line2)}
.chip{flex:1 1 150px;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;background:#0f2c28}
.chip small{display:block;color:var(--mut);font-size:10px;letter-spacing:.3px}
.chip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.c1{border-color:#7b95ff}.chip.c2{border-color:#a98bff}.chip.c3{border-color:#3fb59c}.chip.c4{border-color:var(--acc)}
.nav{display:flex;gap:8px;align-items:center}
.btn{border:1.5px solid var(--acc);background:transparent;border-radius:6px;padding:7px 13px;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{background:rgba(255,122,69,.15)}
.btn.fill{background:var(--acc);color:#1a0d05}
.btn.fill:hover{background:#ff9266}

.main{flex:1;display:flex;min-height:0}

/* 왼쪽 블레이드 */
#blade{width:300px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line2);padding:12px 10px 40px}
.bl-h{font-size:10px;color:var(--mut);letter-spacing:.4px;padding:2px 6px 8px}
.l1h{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:#0f2c28;border:1.5px solid #7b95ff;border-radius:8px;padding:8px 10px;margin-top:4px}
.l1h .id{font-weight:800;color:#7b95ff}
.l1h .nm{flex:1;min-width:0}.l1h .nm b{display:block;font-size:13px}.l1h .nm i{display:block;font-style:normal;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1h .cnt{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.l1h .car{color:var(--mut);transition:transform .2s}
.l1h.workload{color:inherit;text-decoration:none}
.l1h.workload:hover,.l1h.workload:focus-visible{background:#193e37}
.l1:not(.open) .car{transform:rotate(-90deg)}
.l1:not(.open) .l1body{display:none}
.grp{margin:10px 2px 4px 4px;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.grp::after{content:"";flex:1;height:1px;background:var(--line2)}
button.section-toggle{margin-top:10px}
.card{width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;background:#123530;border:1.5px solid var(--line2);border-radius:8px;padding:7px 9px;margin:4px 0;opacity:.78;transition:.15s}
.card:hover{opacity:1;border-color:var(--line)}
.card .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--grn);flex:none}
.card.empty .dot{background:#59736d}
.card .ct{flex:1;min-width:0}.card .ct b{display:block;font-size:12px;line-height:1.35}
.card .ct i{display:block;font-style:normal;color:var(--mut);font-size:10.5px;line-height:1.35;margin-top:1px}
.card .n{font-size:10px;color:var(--mut);white-space:nowrap}.card .n.todo{color:#c9a44f}
.card.sel{opacity:1;border-color:var(--acc);background:#1d3a2e;box-shadow:0 0 0 1px var(--acc),0 0 14px rgba(255,122,69,.3)}
.card.sel .dot{background:var(--acc)}

/* 중앙 */
#center{flex:1;min-width:0;overflow:auto;padding:16px 22px 50px}
.l2head h2{margin:0;font-size:19px}
.l2head p{margin:4px 0 0;color:var(--mut)}
.menu{display:inline-block;margin-top:8px;font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:#bfe0d8;background:#0f2c28}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:6px;padding:5px 12px;font-size:12px;color:var(--mut)}
.tab.sel{border-color:#3fb59c;color:var(--txt);background:rgba(63,181,156,.18)}
.l3desc{margin:8px 0 0;color:var(--mut);font-size:12px}
.scbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#0f2c28}
.scbar .lab{font-size:10px;color:var(--mut);margin-right:2px}
.sc{border:1.5px solid var(--line);background:transparent;border-radius:6px;padding:7px 14px;font-weight:700;font-size:12.5px}
.sc.k0{border-color:#c9786c}.sc.k1{border-color:#d9a441}.sc.k2{border-color:#4fd1a5}
.sc:hover{filter:brightness(1.25)}
.sc.sel{background:var(--acc);border-color:var(--acc);color:#1a0d05}
.sp{flex:1}
.mini{border:1px solid var(--line);background:transparent;border-radius:5px;padding:4px 9px;font-size:11px;color:var(--mut)}
.mini.on{border-color:var(--acc);color:var(--txt)}
.routes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 0}
.routes .lab{font-size:10px;color:var(--mut)}
.rt{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:3px 10px;font-size:11px;color:var(--mut)}
.rt.sel{border-style:solid;border-color:var(--acc);color:var(--txt)}
.rt.blk.sel{border-color:var(--red)}
#routes .rt{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px 3px 4px;text-align:left}
#routes .rt .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#routes .rt .rr{font-style:normal;font-weight:800;font-size:10px;border-radius:9px;padding:1px 7px;color:#06150f;white-space:nowrap}
#routes .rt .rr.ok{background:var(--grn)}#routes .rt .rr.bad{background:var(--red);color:#fff}
#routes .lab small{font-weight:400;opacity:.7;margin-left:4px}
#routes{flex-wrap:wrap}
.scdesc{margin:10px 0 0;font-size:12px;color:#bfe0d8}

#stageWrap{position:relative;margin-top:12px;border:1.5px solid var(--line);border-radius:12px;background:#0b211e;overflow:hidden}
#stage{position:absolute;top:0;transform-origin:0 0}
#edges,#dots{position:absolute;left:0;top:0;pointer-events:none}
#edges{z-index:0}#dots{z-index:3}
.edge{fill:none;stroke:#27564d;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#ah-dim);transition:stroke .2s}
.edge.route{stroke:#4f9b8d;stroke-dasharray:none;marker-end:url(#ah-route)}
.edge.lit{stroke:var(--acc);stroke-dasharray:none;marker-end:url(#ah-lit);filter:drop-shadow(0 0 4px rgba(255,122,69,.7))}
.edge.lit.red{stroke:var(--red);marker-end:url(#ah-red);filter:drop-shadow(0 0 4px rgba(255,93,93,.7))}
.elabel{position:absolute;z-index:2;transform:translate(-50%,-50%);font-size:10.5px;font-weight:700;color:#cfe9e2;background:#0b211e;border:1px solid var(--line);border-radius:9px;padding:1px 6px;line-height:13px;width:max-content;max-width:68px;box-sizing:border-box;text-align:center;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.elabel.lit{color:#1a0d05;background:var(--acc);border-color:var(--acc)}

.node{position:absolute;z-index:1;overflow:hidden;padding:9px 12px 8px;background:#123a34;border:2px solid var(--tea);border-radius:10px;
  transition:box-shadow .3s,border-color .3s,background .3s,opacity .3s}
.node .tag{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--mut);letter-spacing:.3px;margin-bottom:3px}
.node .no{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:#0b211e;border:1px solid currentColor;font-size:9.5px;font-weight:700}
.node .ttl{font-size:12.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .sb{margin-top:3px;font-size:10.5px;line-height:1.35;color:#a9cdc5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node{cursor:pointer}
.np-ov{position:fixed;inset:0;z-index:9000;background:rgba(4,14,12,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.np{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#123a34;border:2px solid var(--tea);border-radius:12px;padding:14px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.np.t-판단{border-color:#d9a441}.np.t-차단{border-color:#ff5d5d}.np.t-끝{border-color:#3ddc84}
.np-h{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);margin-bottom:6px}
.np-h .no{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:#0b211e;border:1px solid currentColor;font-weight:700}
.np-h .actor{margin-left:auto}
.np-x{margin-left:6px;border:1px solid var(--line);background:#0e2a26;color:#cfe3de;border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1}
.np-x:hover{border-color:#ff7a45;color:#ffcfa8}
.np-h .actor + .np-x{margin-left:6px}.np-h:not(:has(.actor)) .np-x{margin-left:auto}
.np-t{font-size:16px;font-weight:800;line-height:1.35;margin-bottom:8px;word-break:keep-all}
.np-r{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px;line-height:1.6}
.np-r>span{color:#8fb7ae;font-weight:700;font-size:11.5px}
.np-r>div{color:#e2f1ed;white-space:pre-wrap;overflow-wrap:anywhere}
.np-r.ev>div{color:#ffd9b8}
.node.hasev .sb{-webkit-line-clamp:2}
.node .ev{margin-top:3px;font-size:10.5px;line-height:1.35;color:#ffd9b8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .ev b{color:#ff9a5c;font-weight:700;margin-right:3px}
.rs-scn .vtog{margin-left:10px;padding:2px 9px;border-radius:12px;border:1px solid #3a6a60;background:#0e2a26;color:#cfe3de;font-size:10.5px;cursor:pointer}
.rs-scn .vtog:hover{border-color:#ff7a45;color:#ffcfa8}
.node .tag .actor{margin-left:auto;max-width:104px;overflow:hidden;text-overflow:ellipsis}
.tt .actor{max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.actor{display:inline-block;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 7px;line-height:15px;border:1px solid currentColor;white-space:nowrap}
.a-adm{color:#f0b64a;background:rgba(240,182,74,.12)}.a-usr{color:#7fb2ff;background:rgba(127,178,255,.12)}
.a-ent{color:#4fd1a5;background:rgba(79,209,165,.12)}.a-app{color:#c3a4ff;background:rgba(195,164,255,.12)}
.a-res{color:#ff9fc4;background:rgba(255,159,196,.12)}.a-dev{color:#8fc8e8;background:rgba(143,200,232,.12)}
.a-onp{color:#d9a37a;background:rgba(217,163,122,.12)}.a-log{color:#b4c2be;background:rgba(180,194,190,.1)}
.a-ext{color:#ffb27a;background:rgba(255,178,122,.12)}
.a-agt{color:#7fd6ff;background:rgba(127,214,255,.12)}.a-dc{color:#ffd37a;background:rgba(255,211,122,.12)}.a-wap{color:#ff9ec7;background:rgba(255,158,199,.12)}
.a-prx{color:#d7e07a;background:rgba(215,224,122,.12)}.a-sb{color:#9db8ff;background:rgba(157,184,255,.12)}.a-adfs{color:#ffa88a;background:rgba(255,168,138,.12)}.a-etc{color:#9fc0b8}
.node.pin{box-shadow:0 0 0 3px rgba(255,122,69,.6)}
#tasks{margin-top:12px;border:1.5px solid var(--line);border-radius:10px;background:#0f2c28;overflow:hidden}
#tasks .th{padding:9px 14px;font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line2);background:#123530}
#tasks .th small{color:var(--mut);font-weight:400}
#tasks .th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#tasks .th .ttog{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 9px;border-radius:14px;border:1px solid var(--line);background:#0e2a26;color:var(--txt);font-weight:700;font-size:12.5px;cursor:pointer}
#tasks .th .ttog:hover{border-color:var(--acc)}
#tasks .th .ttog .ar{color:var(--acc);font-size:12px}
#tasks .th .thint{font-size:12px;font-weight:600;color:#ffcfa8}
#tasks:not(.open) .th{border-bottom:0}
table.tt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.tt th{position:sticky;top:0;text-align:left;font-size:10.5px;color:var(--mut);padding:6px 10px;background:#0f2c28;border-bottom:1px solid var(--line2)}
.tt td{vertical-align:top;padding:7px 10px;border-bottom:1px solid #1b4640;line-height:1.5;word-break:break-word}
.tt tr:last-child td{border-bottom:0}
.tt tbody tr{cursor:pointer;transition:background .2s}
.tt tbody tr:hover{background:#133a34}
.tt tbody tr.hl{background:rgba(255,122,69,.16);box-shadow:inset 3px 0 0 var(--acc)}
.tt .c-no{text-align:center;font-weight:800;color:var(--mut)}
.tt th:nth-child(1){width:34px}.tt th:nth-child(2){width:74px}.tt th:nth-child(3){width:30%}.tt th:nth-child(4){width:26%}
.tt td b{display:block;font-size:12px}
.tt td .s{display:block;color:#a9cdc5}
.tt td .n{display:block;margin-top:3px;color:#8fb7ae;font-size:11px}
.tt td.ui{color:#bfe0d8}.tt td.dt{color:#cfe3de}
.tt td i{color:#59736d;font-style:normal}
.tt tr.t-차단 .c-no{color:var(--red)}
.menu.lic{margin-left:6px;border-color:#6b5d2b;color:#e8d398}
.node.t-시작{border-color:var(--blue);border-radius:30px;padding-left:18px;padding-right:18px}
.node.t-끝{border-color:var(--grn);border-radius:30px;padding-left:18px;padding-right:18px}
.node.t-판단{border-color:var(--amb);background:#2a3a24}
.node.t-차단{border-color:var(--red);background:#3a1f22}
.node.t-시작 .tag,.node.t-끝 .tag{justify-content:center}
.node.visited{border-color:#78d3bf;background:#17463f}
.node.hl{transition-duration:.2s;border-color:var(--acc);background:#2c3d2b;box-shadow:0 0 0 2px rgba(255,122,69,.65),0 0 22px rgba(255,122,69,.6)}
.node.hl.thick{box-shadow:0 0 0 5px rgba(255,122,69,.7),0 0 30px rgba(255,122,69,.75)}
.node.hl.red{border-color:var(--red);background:#47232a;box-shadow:0 0 0 2px rgba(255,93,93,.7),0 0 22px rgba(255,93,93,.65)}
.node.hl.red.thick{box-shadow:0 0 0 5px rgba(255,93,93,.75),0 0 30px rgba(255,93,93,.8)}
.node.ends:not(.hl){outline:1.5px dashed rgba(255,122,69,.55);outline-offset:3px}

.narr{margin-top:10px;min-height:44px;border:1.5px solid var(--acc);border-radius:8px;padding:10px 14px;background:#0f2c28;font-size:13px;display:flex;gap:10px;align-items:center}
.narr .stp{flex:none;font-size:10.5px;font-weight:800;color:#1a0d05;background:var(--acc);border-radius:10px;padding:2px 9px}
.narr.idle .stp{background:#44665f;color:#cfe3de}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cell{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:#0f2c28}
.cell h4{margin:0 0 5px;font-size:11px;letter-spacing:.3px}
.cell:nth-child(1) h4{color:#a98bff}.cell:nth-child(2) h4{color:var(--grn)}.cell:nth-child(3) h4{color:var(--amb)}
.cell p{margin:2px 0;font-size:11.5px;line-height:1.45;color:#cfe3de}
.notes{margin-top:12px;display:grid;gap:8px}
.note{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:8px 12px;background:#0f2c28;font-size:12px;line-height:1.5}
.note b{margin-right:6px}
.note.k-교육{border-left-color:var(--grn)}.note.k-주의{border-left-color:var(--amb)}.note.k-예시,.note.k-예{border-left-color:var(--blue)}.note.k-출처{border-left-color:#7a8f8a}
.note a{color:#9bd0ff;word-break:break-all}
.source-panel{margin-top:12px}
.source-toggle{cursor:pointer;list-style:none}
.source-toggle::-webkit-details-marker{display:none}
.source-panel:not([open]) .source-toggle .car{transform:rotate(-90deg)}
.source-list{display:grid;gap:6px;margin-top:6px}
.source-list .note a{word-break:normal;overflow-wrap:anywhere}
.source-original{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.readme{line-height:1.65;overflow-wrap:anywhere}
.readme h1,.readme h2,.readme h3{margin:1em 0 .45em}
.readme a,.readme-source{color:#9bd0ff}
.readme table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto}
.readme th,.readme td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.readme pre{overflow:auto;background:#0b211e;border:1px solid var(--line);border-radius:8px;padding:12px}
.readme code{font-family:monospace}
.ph{margin-top:14px;border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut)}
.bd{display:inline-block;font-size:9.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:0 5px;margin:0 2px;color:#bfe0d8;vertical-align:1px}
.bd.warn{color:#ffd37a;border-color:#8a6b1f;background:rgba(240,182,74,.1)}

/* ── 조건부 액세스 시뮬레이터 ── */
.a-gsa{color:#7fe0ff;background:rgba(127,224,255,.12)}
.sim-intro{margin:10px 0 0;font-size:12px;color:#bfe0d8}
#simPanel{margin-top:10px;border:1.5px solid var(--line);border-radius:12px;background:#0f2c28;padding:12px}
.sim-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.sim-presets .lab{font-size:10.5px;color:var(--mut);margin-right:4px}
.pre{border:1px solid var(--line);background:transparent;border-radius:14px;padding:4px 11px;font-size:11.5px;color:#cfe3de}
.pre:hover{border-color:var(--acc)}.pre.on{background:rgba(255,122,69,.18);border-color:var(--acc);color:#fff}
.pre.reset{color:var(--mut);border-style:dashed}
.sim-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:14px;margin-top:12px}
.sim-policy .sec,.sim-test{border:1px solid var(--line2);border-radius:10px;background:#0c2723;padding:9px 11px;margin-bottom:9px}
.sim-test{margin-bottom:0;align-self:start;position:sticky;top:6px}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sh b{font-size:12.5px}.sh small{color:var(--mut);font-size:10.5px}
.grow{padding:5px 0;border-top:1px dashed #1f4d46}.grow:first-of-type{border-top:0}
.grow.dim{opacity:.35;pointer-events:none}
.grow.fold{padding:3px 0}.grow.fold .gt{color:var(--mut);margin:0}
.gt{font-size:11px;font-weight:700;color:#a9cdc5;cursor:pointer;margin-bottom:4px}
.gt:hover{color:#fff}.gt i{font-style:normal;font-weight:400;color:var(--mut);margin-left:6px;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.opt{border:1.5px solid var(--line);background:#102f2a;border-radius:7px;padding:4px 9px;font-size:11.5px;color:#cfe3de;text-align:left;line-height:1.3;transition:.15s}
.opt:hover{border-color:#7fd6c3}
.opt.on{background:rgba(63,181,156,.22);border-color:#4fd1a5;color:#fff;font-weight:700}

<script id="readme-data" type="application/json">"<h1 id=\"microsoft365_tranning\">Microsoft365_Tranning<\/h1>\n<p>Microsoft 365 전반에 걸친 트레이닝 보드를 구축하고, 이를 바탕으로 내부 커리큘럼의 초안을 만드는 저장소입니다.<\/p>\n<p>각 보드는 Markdown 원고에서 생성하는 단독 실행 HTML입니다. 기능을 고르면 &quot;기능이 꺼져 있을 때 → 구성할 때 → 켠 뒤&quot;의 시나리오별 데이터 흐름을 보여 줍니다. Entra와 다른 네 보드에 시나리오와 출처가 작성되어 있으나 내용과 최신 제품 사실의 검증은 아직 완료되지 않았습니다.<\/p>\n<h2 id=\"구성\">구성<\/h2>\n<table>\n<thead>\n<tr>\n<th>폴더<\/th>\n<th>내용<\/th>\n<th>상태<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"entra-edu-board/\"><code>entra-edu-board/<\/code><\/a><\/td>\n<td>Microsoft Entra Admin Center(Entra ID 워크로드) 교육 보드 — 기능 37개, 시나리오 261개<\/td>\n<td>작성 중<\/td>\n<\/tr>\n<tr>\n<td><a href=\"edu-intune-board/\"><code>edu-intune-board/<\/code><\/a><\/td>\n<td>Intune<\/td>\n<td>초안<\/td>\n<\/tr>\n<tr>\n<td><a href=\"edu-purview-board/\"><code>edu-purview-board/<\/code><\/a><\/td>\n<td>Purview<\/td>\n<td>초안<\/td>\n<\/tr>\n<tr>\n<td><a href=\"edu-defender-board/\"><code>edu-defender-board/<\/code><\/a><\/td>\n<td>Defender XDR · Defender for Cloud<\/td>\n<td>초안<\/td>\n<\/tr>\n<tr>\n<td><a href=\"edu-copilot-board/\"><code>edu-copilot-board/<\/code><\/a><\/td>\n<td>Copilot · Graph<\/td>\n<td>초안<\/td>\n<\/tr>\n<tr>\n<td>각 보드의 <code>원본/<\/code><\/td>\n<td>기능별 편집 원고<\/td>\n<td>시나리오 작성 완료 · 제품/테넌트 검증 진행 중<\/td>\n<\/tr>\n<tr>\n<td><a href=\"entra-edu-board/split/\"><code>entra-edu-board/split/<\/code><\/a><\/td>\n<td>기존 분리본 원고<\/td>\n<td>참고용<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>제품별 보드를 나눕니다. Defender 보드는 XDR과 Defender for Cloud를 별도 섹션으로 담습니다.<\/p>\n<h2 id=\"빠른-시작\">빠른 시작<\/h2>\n<p><a href=\"MainBoard.html\"><code>MainBoard.html<\/code><\/a>을 열면 프로젝트 소개와 워크로드별 보드를 볼 수 있습니다. GitHub Pages에서는 사이트 루트에서도 메인 보드로 이동합니다.<\/p>\n<pre><code class=\"language-bash\">python3 -m pip install -r requirements.txt\ncd entra-edu-board\npython3 build_board.py            # 원본/ → entra-edu-board.html, &quot;점검 경고 0건&quot;이어야 함\ncd ..\npython3 -m http.server 8765       # http://127.0.0.1:8765/\n<\/code><\/pre>\n<p>자세한 구조와 편집 방법은 <a href=\"entra-edu-board/README.md\"><code>entra-edu-board/README.md<\/code><\/a>를 보세요.<\/p>\n<p>다른 네 초안 보드를 다시 만들려면 저장소 루트에서 <code>python3 build_edu_boards.py<\/code>를 실행하세요. 각 보드의 <code>원본/<\/code>에서 기능별 MD를 편집하며, 기존 <code>split/<\/code> 파일은 참고용입니다. 네 초안 보드는 Entra와 같은 중앙 UI를 사용합니다. L3 분류 탭과 L4 시나리오 버튼에서 선택하면 해당 흐름과 Task가 표시되고 재생되며, 실제 경로가 둘 이상인 경우에만 분기 선택이 나타납니다. 별도의 메인 시나리오 패널은 두지 않습니다. 공식 문서 출처와 교육 예시는 구분하며, <code>[확인 필요]<\/code> 항목은 대상 테넌트에서 대조해야 합니다. 출처 연결은 시나리오 전체가 제품의 공식 예제라는 뜻이 아닙니다.<\/p>\n<p>메인 보드의 프로젝트 소개는 이 README의 빌드 시점 복사본입니다. README를 수정한 뒤 Entra 또는 초안 보드를 다시 빌드하면 함께 갱신됩니다.<\/p>\n<p>공유 미리보기 이미지는 <a href=\"https://kenney.nl/assets/mini-characters\">Kenney Mini Characters<\/a>의 캐릭터 렌더를 사용합니다 (CC0).<\/p>\n"</script>

function sourcePanelHtml(sources){

    catch(error) {

/* ───────── 레이아웃 · 경로 ───────── */
function layout(l4){
  const nodes = l4.nodes, edges = l4.edges;
  const preds = {}; nodes.forEach(n=>preds[n.id]=[]);
  edges.forEach(e=>preds[e.to].push(e.from));
  const level = {};
  const lv = id=>{ if(id in level) return level[id]; level[id]=0; const p=preds[id]; return level[id] = p.length ? Math.max(...p.map(lv))+1 : 0; };
  nodes.forEach(n=>lv(n.id));
  const pos = {};
  const taken = new Set();
  const order = nodes.map((n,i)=>[n,i]).sort((a,b)=>level[a[0].id]-level[b[0].id] || a[1]-b[1]);
  order.forEach(([n])=>{
    const L = level[n.id], band = Math.floor(L/COLS), col = L%COLS;
    const pb = preds[n.id].map(p=>pos[p]).find(p=>p && p.band===band);
    let row = pb ? pb.row : 0;
    while(taken.has(`${band},${col},${row}`)) row++;
    taken.add(`${band},${col},${row}`);
    pos[n.id] = {band,col,row,level:L};
  });
  const nb = Math.max(...Object.values(pos).map(p=>p.band))+1;
  const bandRows = Array(nb).fill(1);
  Object.values(pos).forEach(p=>bandRows[p.band]=Math.max(bandRows[p.band],p.row+1));
  const bandH = bandRows.map(r=>PADT + r*NH + (r-1)*GY + GUT);
  const bandTop = []; bandH.reduce((a,h,i)=>(bandTop[i]=a,a+h),0);
  const usedCols = Math.min(COLS, Math.max(...Object.values(pos).map(p=>p.level))+1);
  /* 열 사이 간격은 그 칸을 지나는 화살표 수와 라벨 폭에 맞춰 계산한다 */
  const gaps = planGaps(pos, edges, usedCols);
  const gapW = gaps.map((g,i)=> (i===0||i===usedCols) ? Math.max(44, g.n*9+34) : Math.max(MINGAP, (g.lab>0?4+g.lab+8:8) + g.n*9 + 18));
  const colX = []; let cx = gapW[0]; for(let c=0;c<usedCols;c++){ colX[c] = cx; cx += NW + gapW[c+1]; }
  Object.values(pos).forEach(p=>{ p.x = colX[p.col]; p.y = bandTop[p.band] + PADT + p.row*(NH+GY); });
  const W = cx;
  const H = bandTop[nb-1] + bandH[nb-1] - GUT*0.5 + 22;
  return {pos,W,H,bandTop,bandH,bandRows,usedCols,colX,gaps};
}
function planGaps(pos, edges, usedCols){
  const g = Array.from({length:usedCols+1},()=>({lab:0,n:0}));      // g[i] = (i-1)열과 i열 사이 · g[0]=왼쪽 여백 · g[usedCols]=오른쪽 여백
  const lw = e => e.label ? Math.min(68, Math.ceil([...e.label].length*9)+14) : 0;
  edges.forEach(e=>{
    const s = pos[e.from], t = pos[e.to], same = s.band===t.band;
    if(same && t.col===s.col+1){ g[s.col+1].lab = Math.max(g[s.col+1].lab, lw(e)); if(s.row!==t.row) g[s.col+1].n++; return; }
    if(same && s.row===t.row && !Object.values(pos).some(m=>m.band===s.band && m.row===s.row && m.col>s.col && m.col<t.col)) return;
    g[s.col+1].n++; g[t.col].n++;
  });
  return g;
}
const MINGAP = 66;

/* 화살표 라우팅: 노드 사이 통로(열 사이 세로 통로 · 행 사이 가로 통로)로만 지나가므로 도형을 가로지르지 않는다 */
function slotX(L, use, i){
  const k = (use['s'+i] = (use['s'+i]||0)+1) - 1;
  if(i===0) return L.colX[0] - 16 - 9*k;
  if(i===L.usedCols) return L.colX[L.usedCols-1] + NW + 16 + 9*k;
  return L.colX[i-1] + NW + (L.gaps[i].lab>0 ? 4+L.gaps[i].lab+8 : 8) + 9*k + 4;
}
function lanesOf(L,b){
  const rows = L.bandRows[b], top = L.bandTop[b];
  const arr = [{k:`t${b}`, y: top + PADT*0.4}];
  for(let k=0;k<rows-1;k++) arr.push({k:`g${b}.${k}`, y: top + PADT + (k+1)*NH + k*GY + GY/2});
  arr.push({k:`b${b}`, y: top + PADT + rows*NH + (rows-1)*GY + GUT*0.5});
  return arr;
}
function routePts(e, L, use){
  const s = L.pos[e.from], t = L.pos[e.to];
  const sx = s.x+NW, sy = s.y+NH/2, tx = t.x, ty = t.y+NH/2;
  const bump = key => (use[key] = (use[key]||0)+1, (use[key]-1)*8);
  const sameBand = s.band===t.band;
  if(sameBand && t.col===s.col+1){
    if(s.row===t.row) return [[sx,sy],[tx,ty]];
    const cx = slotX(L, use, s.col+1);
    return [[sx,sy],[cx,sy],[cx,ty],[tx,ty]];
  }
  if(sameBand && s.row===t.row){
    const hit = Object.values(L.pos).some(m=>m.band===s.band && m.row===s.row && m.col>s.col && m.col<t.col);
    if(!hit) return [[sx,sy],[tx,ty]];
  }
  const cx1 = slotX(L, use, s.col+1), cx2 = slotX(L, use, t.col);
  let lane;
  if(sameBand){
    lane = lanesOf(L,s.band).map(l=>({...l, cost:Math.abs(l.y-sy)+Math.abs(l.y-ty)+16*(use[l.k]||0)})).sort((a,b)=>a.cost-b.cost)[0];
  } else {
    const ls = lanesOf(L,s.band); lane = ls[ls.length-1];
  }
  const hy = lane.y + bump(lane.k);
  return [[sx,sy],[cx1,sy],[cx1,hy],[cx2,hy],[cx2,ty],[tx,ty]];
}
function ptsToPath(pts, r=9){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [px,py]=pts[i-1], [cx,cy]=pts[i], [nx,ny]=pts[i+1];
    const d1 = Math.hypot(cx-px,cy-py), d2 = Math.hypot(nx-cx,ny-cy), rr = Math.min(r, d1/2, d2/2);
    if(rr<1){ d += ` L${cx},${cy}`; continue; }
    const ax = cx-(cx-px)/d1*rr, ay = cy-(cy-py)/d1*rr, bx = cx+(nx-cx)/d2*rr, by = cy+(ny-cy)/d2*rr;
    d += ` L${ax},${ay} Q${cx},${cy} ${bx},${by}`;
  }
  const l = pts[pts.length-1]; return d + ` L${l[0]},${l[1]}`;
}
const segsOf = pts => pts.slice(1).map((p,i)=>({x1:pts[i][0],y1:pts[i][1],x2:p[0],y2:p[1]}));
const rectHitsSeg = (r,s,pad=2)=>{
  const x1=Math.min(s.x1,s.x2)-pad, x2=Math.max(s.x1,s.x2)+pad, y1=Math.min(s.y1,s.y2)-pad, y2=Math.max(s.y1,s.y2)+pad;
  return !(r.r<x1 || r.l>x2 || r.b<y1 || r.t>y2);
};
const rectHitsRect = (a,b,pad=3)=>!(a.r+pad<b.l || a.l-pad>b.r || a.b+pad<b.t || a.t-pad>b.b);
/* 라벨 배치: ① 후보 자리를 먼저 모두 구하고 ② 선택지가 적은 라벨부터 노드 · 다른 라벨 · 다른 화살표와 겹치지 않는 자리에 놓는다 */
function placeLabels(items, L, nodeRects, edgePts){
  const allSegs = Object.entries(edgePts).map(([k,p])=>[k,segsOf(p)]);
  items.forEach(it=>{
    const {pts,w,h,key} = it;
    const others = allSegs.filter(([k])=>k!==key).flatMap(([,s])=>s);
    const on = [], off = [], far = [];
    let acc = 0;
    segsOf(pts).forEach((sg,i,arr)=>{
      const len = Math.hypot(sg.x2-sg.x1, sg.y2-sg.y1), isLast = i===arr.length-1;
      const horiz = Math.abs(sg.x2-sg.x1) >= Math.abs(sg.y2-sg.y1);
      const endMargin = (horiz ? w/2 : h/2) + 14;
      for(let d=0; d<=len; d+=4){
        const tt = len? d/len : 0, x = sg.x1+(sg.x2-sg.x1)*tt, y = sg.y1+(sg.y2-sg.y1)*tt;
        if(acc+d < 6) continue;
        if(isLast && len-d < endMargin) continue;
        on.push({x,y});
        if(horiz){ off.push({x,y:y-(h/2+5)}); off.push({x,y:y+(h/2+5)}); }
        else { off.push({x:x-(w/2+5),y}); off.push({x:x+(w/2+5),y}); }
        if(d % 12 === 0){
          [17,29,41].forEach(k=>{
            if(horiz){ far.push({x,y:y-(h/2+k)}); far.push({x,y:y+(h/2+k)}); }
            else { far.push({x:x-(w/2+k),y}); far.push({x:x+(w/2+k),y}); }
          });
        }
      }
      acc += len;
    });
    const rect = c=>({l:c.x-w/2,r:c.x+w/2,t:c.y-h/2,b:c.y+h/2});
    const cand = [...on,...off,...far].filter(c=>{ const r = rect(c); return r.l>=2 && r.t>=2 && r.r<=L.W-2 && r.b<=L.H-2 && !nodeRects.some(n=>rectHitsRect(r,n,3)); });
    const strict = cand.filter(c=>!others.some(s=>rectHitsSeg(rect(c),s,2)));
    it.cand = cand; it.strict = strict; it.rect = rect; it.fallback = on[Math.min(on.length-1,3)] || {x:pts[0][0]+20,y:pts[0][1]};
  });
  const placed = [];
  items.slice().sort((a,b)=>a.strict.length-b.strict.length).forEach(it=>{
    const free = c=>!placed.some(p=>rectHitsRect(it.rect(c),p,3));
    const c = it.strict.find(free) || it.cand.find(free) || it.strict[0] || it.cand[0] || it.fallback;
    placed.push(it.rect(c)); it.at = c;
  });
}

function enumRoutes(l4){
  if(l4.fixedRoute){
    const ids = l4.fixedRoute, es = ids.slice(1).map((id,i)=>l4.edges.find(e=>e.from===ids[i]&&e.to===id)).filter(Boolean);
    const last = l4.nodes.find(n=>n.id===ids[ids.length-1]);
    return [{nodes:ids, edges:es, blocked:last.type==='차단', name:'이 로그인의 평가 경로'}];
  }
  const out = {}; l4.edges.forEach(e=>(out[e.from] ||= []).push(e));
  const byId = Object.fromEntries(l4.nodes.map(n=>[n.id,n]));
  const res = [];
  (function dfs(id,pn,pe){
    if(res.length>=12) return;
    const es = out[id]||[];
    if(!es.length){ res.push({nodes:pn,edges:pe}); return; }
    es.forEach(e=>{ if(!pn.includes(e.to)) dfs(e.to,[...pn,e.to],[...pe,e]); });
  })(l4.nodes[0].id,[l4.nodes[0].id],[]);
  // 분기 지점(라벨 붙은 선택지가 둘 이상인 노드)마다 ‘무엇을 판단해서 → 어느 쪽’인지를 시나리오 이름으로 쓴다
  const isBranch = id => (out[id]||[]).filter(e=>e.label).length>=2;
  res.forEach(r=>{
    const last = byId[r.nodes[r.nodes.length-1]];
    r.blocked = last.type==='차단';
    r.steps = r.edges.filter(e=>isBranch(e.from)).map(e=>({q:byId[e.from].title.replace(/[?？]\s*$/,''), a:e.label}));
    r.key = r.edges.filter(e=>isBranch(e.from)).map(e=>e.label).join(' ▸ ');
    r.end = last.title;
    r.full = r.steps.length ? r.steps.map(x=>`${x.q} → ${x.a}`).join(' · ') : '분기 없음';
  });
  // 칩 이름은 요약: 결정적인 마지막 분기 + 도착한 결과. 이름이 겹치면 앞쪽 분기를 하나씩 더 붙여 구분한다
  const sumOf = (r,k)=> (r.steps.length ? r.steps.slice(-k).map(x=>`${x.q} → ${x.a}`).join(' · ') + ' ▸ ' : '') + r.end;
  const kk = res.map(()=>1);
  for(let guard=0; guard<12; guard++){
    const names = res.map((r,i)=>sumOf(r,kk[i])), cnt = {}; names.forEach(n=>cnt[n]=(cnt[n]||0)+1);
    let grew = false;
    res.forEach((r,i)=>{ if(cnt[names[i]]>1 && kk[i]<r.steps.length){ kk[i]++; grew = true; } });
    if(!grew) break;
  }
  // 작성된 시나리오 요약이 있으면 그것을 버튼 이름으로 쓴다(없을 때만 판단 요약으로 대체)
  res.forEach((r,i)=>{ r.name = (l4.rsum && l4.rsum[r.key]) || sumOf(r,kk[i]); });
  // 완료 경로를 앞에 두되, 같은 묶음 안에서는 MD의 `- 시나리오:` 줄 순서를 따른다(기본으로 보여 줄 시나리오를 작성자가 정한다)
  const ord = l4.rsum ? Object.keys(l4.rsum) : [];
  const pos = r => { const i = ord.indexOf(r.key); return i<0 ? 999 : i; };
  res.sort((a,b)=>(a.blocked-b.blocked) || (pos(a)-pos(b)));
  return res;
}

function chooseCols(l4){
  const wrap = $('#stageWrap'); const avail = wrap ? wrap.clientWidth : 1000;
  const levels = Math.max(1, l4.nodes.length);
  for(let c=Math.min(levels,6); c>=3; c--){
    const W = 90 + c*NW + (c-1)*GXE;
    if(avail/W >= 0.78) return c;
  }
  return 3;
}

/* ───────── 도식 그리기 ───────── */
function buildStage(){
  const l3 = curL2().l3[st.l3], l4 = l3.l4[st.l4];
  const stage = $('#stage'); stage.innerHTML = '';
  if(!l4.nodes.length){ view=null; return; }
  COLS = chooseCols(l4);
  const L = layout(l4);
  const routes = enumRoutes(l4);
  const svgNS = 'http://www.w3.org/2000/svg';
  const mk = (c)=>`<marker id="ah-${c[0]}" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 z" fill="${c[1]}"/></marker>`;
  const svg = document.createElementNS(svgNS,'svg'); svg.id='edges'; svg.setAttribute('width',L.W); svg.setAttribute('height',L.H);
  svg.innerHTML = `<defs>${[['dim','#27564d'],['route','#4f9b8d'],['lit','#ff7a45'],['red','#ff5d5d'],['ok','#3ddc84'],['bad','#ff5d5d']].map(mk).join('')}</defs>`;
  const dots = document.createElementNS(svgNS,'svg'); dots.id='dots'; dots.setAttribute('width',L.W); dots.setAttribute('height',L.H);

  stage.style.width = L.W+'px'; stage.style.height = L.H+'px';
  stage.appendChild(svg); stage.appendChild(dots);

  const edgeEls = {}, labelEls = {}, use = {}, edgePts = {};
  l4.edges.forEach(e=>{
    const pts = routePts(e,L,use); edgePts[e.from+'>'+e.to] = pts;
    const p = document.createElementNS(svgNS,'path');
    p.setAttribute('d', ptsToPath(pts)); p.setAttribute('class','edge');
    svg.appendChild(p); edgeEls[e.from+'>'+e.to] = p;
  });
  const nodeEls = {};
  l4.nodes.forEach(n=>{
    const p = L.pos[n.id];

    d.style.cssText = `left:${p.x}px;top:${p.y}px;width:${NW}px;height:${NH}px`;

    const no = /^\d+$/.test(n.id) ? n.id : '✕';
    d.innerHTML = `<div class="tag"><span class="no">${no}</span><span>${esc(n.type)}</span>`
      + (n.phase==='runtime'?'<span class="phrt">토큰 이후</span>':n.phase==='token'?'<span class="phrt tk">토큰 발급</span>':'')
      + (n.actor?`<span class="actor ${actorClass(n.actor)}">${esc(n.actor)}</span>`:'') + `</div>`
      + `<div class="ttl">${rich(n.title)}</div>` + (n.sub?`<div class="sb">${rich(n.sub)}</div>`:'')
      + (n.ev?`<div class="ev"><b>이번 로그인</b> ${rich(n.ev)}</div>`:'');
    if(n.ev) d.classList.add('hasev');
    d.onclick = ()=>{ pinNode(n.id); openNodeDetail(n.id); };
    stage.appendChild(d); nodeEls[n.id] = d;
  });
  // 라벨: 먼저 크기를 재고, 선·노드·다른 라벨과 겹치지 않는 자리에 놓는다
  const items = [];
  l4.edges.forEach(e=>{
    if(!e.label) return;
    const key = e.from+'>'+e.to;
    const s = document.createElement('div'); s.className='elabel'+(/^(Kerberos|NTLM|LDAP|WS-Fed|SAML|HTTPS|TLS)/.test(e.label)?' proto':''); s.textContent=e.label;
    s.style.visibility='hidden'; stage.appendChild(s); labelEls[key] = s;
    items.push({key, pts:edgePts[key], w:s.offsetWidth, h:s.offsetHeight});
  });
  const nodeRects = Object.values(L.pos).map(p=>({l:p.x,r:p.x+NW,t:p.y,b:p.y+NH}));
  placeLabels(items, L, nodeRects, edgePts); window.__lastItems = items;
  items.forEach(it=>{ const s = labelEls[it.key]; s.style.left = it.at.x+'px'; s.style.top = it.at.y+'px'; s.style.visibility=''; });
  view = {l4,L,routes,edgeEls,labelEls,nodeEls,rowEls:{},cols:COLS,byId:Object.fromEntries(l4.nodes.map(n=>[n.id,n]))};
  renderTasks();
  st.route = Math.min(st.route, routes.length-1);
  renderRoutes(); applyRoute(); fit(); resetVisual(); markRoute();
}
/* 시뮬레이터: 이 로그인이 실제로 지나가는 경로를 정적으로 강조하고 나머지는 흐리게 */
const POL_OK = new Set(['일치','충족','예','사용','보고 전용','완료','통과','수행','다운로드 아님','같은 기기','허용','전체 허용','정상','주기 이내','없음']);
const POL_BAD = new Set(['불일치','미충족','아니오','사용 안 함','미완료','불통과','수행 안 함','다운로드','다른 기기','차단 범주','장애 중','주기 초과','발생','차단']);
const polOf = l => POL_OK.has(l) ? 'ok' : POL_BAD.has(l) ? 'bad' : '';
function markRoute(){
  const l3 = curL2().l3[st.l3]; if(!view || !l3 || !l3.sim) return;
  const r = view.routes[0], on = new Set(r.nodes), last = view.byId[r.nodes[r.nodes.length-1]];
  Object.entries(view.nodeEls).forEach(([id,el])=>{ el.classList.toggle('onroute',on.has(id)); el.classList.toggle('offroute',!on.has(id)); });
  view.nodeEls[last.id].classList.add(last.type==='차단'?'endbad':'endok');
  r.edges.forEach(e=>{
    const pol = polOf(e.label), p = view.edgeEls[e.from+'>'+e.to], lb = view.labelEls[e.from+'>'+e.to];
    p.classList.add('onpath'); if(lb) lb.classList.add('onpath');
    if(pol){ p.classList.add(pol); if(lb) lb.classList.add(pol); view.nodeEls[e.from].classList.add('res-'+pol); }
  });
  Object.entries(view.edgeEls).forEach(([k,p])=>{ if(!p.classList.contains('onpath')) p.classList.add('offpath'); });
}

const ACTOR_CLS = [['PTA 에이전트','a-agt'],['DC (AD)','a-dc'],['WAP','a-wap'],['프록시','a-prx'],['Service Bus','a-sb'],['AD FS','a-adfs'],['GSA','a-gsa'],['Global Secure','a-gsa'],['관리자','a-adm'],['사용자','a-usr'],['Entra','a-ent'],['앱','a-app'],['리소스','a-res'],['디바이스','a-dev'],['온프레미스','a-onp'],['로그','a-log'],['외부','a-ext']];
const actorClass = a => (ACTOR_CLS.find(([k])=>a.includes(k))||[0,'a-etc'])[1];

function renderTasks(){
  const box = $('#tasks'); if(!box) return;
  TASK_ALL = false;
  const v = view;
  const rows = v.l4.nodes.map(n=>{
    const no = /^\d+$/.test(n.id) ? n.id : '✕';
    return `<tr data-id="${esc(n.id)}" class="t-${esc(n.type)}"><td class="c-no">${no}</td>`
      + `<td>${n.phase==='runtime'?'<span class="phrt">토큰 이후</span> ':''}${n.actor?`<span class="actor ${actorClass(n.actor)}">${esc(n.actor)}</span>`:''}</td>`
      + `<td><b>${rich(n.title)}</b>${n.sub?`<span class="s">${rich(n.sub)}</span>`:''}${n.narr?`<span class="n">${rich(n.narr)}</span>`:''}</td>`
      + `<td class="ui">${n.ui?rich(n.ui):'<i>—</i>'}</td><td class="dt">${n.data?rich(n.data):'<i>—</i>'}</td></tr>`;
  }).join('');
  box.innerHTML = `<div class="th"><button type="button" class="ttog" id="ttog" aria-expanded="false" aria-controls="tbody"><span class="ar">▸</span> Task 상세</button><span class="thint" id="thint"></span><small id="tcount"></small><button type="button" class="tall" id="tall"></button></div>`
    + `<div class="tbodywrap" id="tbody" hidden><table class="tt"><thead><tr><th>#</th><th>주체</th><th>Task</th><th>위치 (포털 · API)</th><th>데이터 · 결과</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  box.querySelectorAll('tbody tr').forEach(tr=>{ v.rowEls[tr.dataset.id] = tr; tr.onclick = ()=>pinNode(tr.dataset.id); });
  $('#tall').onclick = ()=>{ TASK_ALL = !TASK_ALL; applyTaskFilter(); };
  $('#ttog').onclick = ()=>{ TASK_OPEN = !TASK_OPEN; applyTaskOpen(); };

/* Task 상세는 기본으로 접어 두고, 펼치면 전체 내용을 표로 본다(카드를 누르면 팝업으로도 볼 수 있다) */
let TASK_OPEN = false;
function applyTaskOpen(){
  const box = $('#tasks'); if(!box) return;
  $('#tbody').hidden = !TASK_OPEN;
  const t = $('#ttog'); t.setAttribute('aria-expanded', String(TASK_OPEN)); t.querySelector('.ar').textContent = TASK_OPEN ? '▾' : '▸';
  $('#thint').textContent = TASK_OPEN ? '접기' : '펼쳐서 전체 내용 확인';

}
/* 하단 Task는 선택한 시나리오(경로)가 지나는 단계만, 경로 순서대로 보여 준다 */
let TASK_ALL = false;
function applyTaskFilter(){
  const box = $('#tasks'); if(!box || !view) return;
  const tb = box.querySelector('tbody'); if(!tb) return;
  const r = view.routes[st.route] || view.routes[0], set = new Set(r.nodes);
  r.nodes.concat(view.l4.nodes.map(n=>n.id).filter(id=>!set.has(id))).forEach(id=>{ const tr = view.rowEls[id]; if(tr) tb.appendChild(tr); });
  view.l4.nodes.forEach(n=>{ const tr = view.rowEls[n.id], off = !set.has(n.id); if(!tr) return; tr.classList.toggle('rowhide',off && !TASK_ALL); tr.classList.toggle('rowdim',off && TASK_ALL); });
  const total = view.l4.nodes.length, mine = r.nodes.length;
  $('#tcount').textContent = mine===total ? `— 이 시나리오 ${mine}단계` : `— 선택한 시나리오 ${mine}단계 (전체 ${total}개 중)`;
  const bt = $('#tall'); bt.hidden = mine===total; bt.textContent = TASK_ALL ? '시나리오 단계만 보기' : '전체 Task 보기';
}
/* 카드를 누르면 잘리지 않은 전체 내용을 팝업으로 보여 준다 */
function closeNodeDetail(){ const o = document.getElementById('nodePop'); if(o) o.remove(); document.removeEventListener('keydown',nodePopKey,true); }
function nodePopKey(e){ if(e.key==='Escape'){ e.stopPropagation(); closeNodeDetail(); } }
function branchRows(id){
  const es = view.l4.edges.filter(e=>e.from===id && e.label);
  if(new Set(es.map(e=>e.to)).size<2) return '';
  const cur = view.routes[st.route] || view.routes[0], on = new Set(cur.edges.map(e=>e.from+'>'+e.to));
  return es.map(e=>{ const t = view.byId[e.to]; return `${on.has(e.from+'>'+e.to)?'▶ ':'　'}<b>${esc(e.label)}</b> → ${/^\d+$/.test(t.id)?t.id+'. ':''}${esc(t.title)}`; }).join('\n');
}
function openNodeDetail(id){
  const n = view && view.byId[id]; if(!n) return;

  const ph = n.phase==='runtime' ? '<span class="phrt">토큰 이후</span>' : n.phase==='token' ? '<span class="phrt tk">토큰 발급</span>' : '';

    + `<div class="np-h"><span class="no">${no}</span><span class="ty">${esc(n.type)}</span>${ph}${n.actor?`<span class="actor ${actorClass(n.actor)}">${esc(n.actor)}</span>`:''}<button type="button" class="np-x" title="닫기 (Esc)">✕</button></div>`
    + `<div class="np-t">${rich(n.title)}</div>`
    + row('구성',n.sub?rich(n.sub):'')
    + row('이번 로그인',n.ev?rich(n.ev):'','ev')
    + row('설명',n.narr?rich(n.narr):'')
    + row('위치 (포털 · API)',n.ui?rich(n.ui):'')
    + row('데이터 · 결과',n.data?rich(n.data):'')

function pinNode(id){

  stopAll(); resetVisual();
  const n = view.byId[id];
  view.nodeEls[id].classList.add('hl','pin'); if(n.type==='차단') view.nodeEls[id].classList.add('red');

function fit(){
  if(!view) return;
  const wrap = $('#stageWrap'), stage = $('#stage'); if(!wrap) return;
  if(chooseCols(view.l4) !== view.cols){ stopAll(); buildStage(); return; }
  const avail = wrap.clientWidth;
  const sc = Math.min(1.12, avail / view.L.W);

function applyRoute(){
  const r = view.routes[st.route] || view.routes[0];
  Object.values(view.edgeEls).forEach(p=>p.classList.remove('route'));
  Object.values(view.nodeEls).forEach(n=>n.classList.remove('ends'));
  r.edges.forEach(e=>view.edgeEls[e.from+'>'+e.to].classList.add('route'));
  // 조건 분기(참/거짓)는 라벨을 한쪽만 보인다: 선택한 경로가 지나는 쪽, 지나지 않는 노드는 첫 번째 쪽
  const on = new Set(r.edges.map(e=>e.from+'>'+e.to)), outs = {};
  view.l4.edges.forEach(e=>(outs[e.from] ||= []).push(e));
  Object.values(outs).forEach(es=>{
    const lab = es.filter(e=>e.label); if(new Set(lab.map(e=>e.to)).size<2) return;
    const keep = lab.find(e=>on.has(e.from+'>'+e.to)) || lab[0];
    lab.forEach(e=>{ const l = view.labelEls[e.from+'>'+e.to]; if(l) l.classList.toggle('hid', e!==keep); });
  });
  // 선택한 경로가 지나지 않는 카드(차단·종료 이후의 카드 포함)는 비활성으로 흐리게 한다
  const onN = new Set(r.nodes), lastN = view.byId[r.nodes[r.nodes.length-1]];
  Object.entries(view.nodeEls).forEach(([id,el])=>{ el.classList.toggle('offroute',!onN.has(id)); el.classList.remove('endok','endbad'); });
  view.nodeEls[lastN.id].classList.add(lastN.type==='차단'?'endbad':'endok');
  Object.entries(view.labelEls).forEach(([k,l])=>l.classList.toggle('offl',!on.has(k)));
  applyTaskFilter();
  view.nodeEls[r.nodes[0]].classList.add('ends');

function anim(ms,my,cb){
  return new Promise(res=>{
    let acc = 0, last = performance.now();
    const f = now=>{
      if(my!==runId) return res(false);
      const dt = now-last; last = now;
      if(!st.paused) acc += dt*st.speed;
      const p = Math.min(1,acc/ms);
      if(cb) cb(p);
      if(p>=1) return res(true);
      requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  });
}
const ease = p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function setHl(id,on,isBlock){
  const n = view.nodeEls[id]; if(!n) return;
  n.classList.toggle('hl',on);
  n.classList.toggle('red',on && !!isBlock);
  const r = view.routes[st.route];
  n.classList.toggle('thick', on && (id===r.nodes[0] || id===r.nodes[r.nodes.length-1]));
  if(!on) n.classList.add('visited');
  const row = view.rowEls[id];
  if(row) row.classList.toggle('hl',on);
}
async function runSeg(e,my,stepNo,total){
  const v = view, from = v.byId[e.from], to = v.byId[e.to];
  const path = v.edgeEls[e.from+'>'+e.to], len = path.getTotalLength();
  const dot = $('#dot'); const blocked = to.type==='차단';
  setHl(e.from,true,from.type==='차단');
  setNarr(narrOf(from), `STEP ${stepNo}/${total}`);
  if(REDUCED){
    if(!await anim(450,my)) return false;
  } else {
    const p0 = path.getPointAtLength(0);
    dot.setAttribute('transform',`translate(${p0.x},${p0.y})`);
    if(!await anim(200,my,p=>dot.setAttribute('opacity',p))) return false;           // Fade-In
    if(!await anim(800,my,p=>{ const q = path.getPointAtLength(len*ease(p)); dot.setAttribute('transform',`translate(${q.x},${q.y})`); })) return false;
  }
  setHl(e.to,true,blocked);
  path.classList.add('lit'); path.classList.toggle('red',blocked);
  const lb = v.labelEls[e.from+'>'+e.to]; if(lb) lb.classList.add('lit');
  if(!REDUCED && !await anim(200,my,p=>dot.setAttribute('opacity',1-p))) return false; // Fade-Out
  dot.setAttribute('opacity','0');
  setHl(e.from,false);
  return await anim(120,my);
}
async function playCurrent(){
  if(!view) return false;
  const my = ++runId;
  resetVisual();
  const v = view, r = v.routes[st.route] || v.routes[0];
  const first = v.byId[r.nodes[0]];
  if(!r.edges.length){ setHl(first.id,true); setNarr(narrOf(first),'STEP 1/1'); return true; }
  for(let i=0;i<r.edges.length;i++){
    if(!await runSeg(r.edges[i],my,i+1,r.edges.length)) return false;
  }
  const last = v.byId[r.nodes[r.nodes.length-1]];
  setNarr(narrOf(last), `완료 ${r.edges.length}/${r.edges.length}`);
  return true;
}
async function playAll(){
  stopAll(); const chain = ++chainId;
  const l3 = curL2().l3[st.l3];
  for(let k=0;k<l3.l4.length;k++){
    if(chain!==chainId) return;
    runId++; Object.assign(st,{l4:k,route:0}); renderCenter();
    const ok = await playCurrent();
    if(!ok || chain!==chainId) return;
    await new Promise(r=>setTimeout(r,700));
  }
}

      if(sel.includes('l-ex-compliant') && L==='gsa') return {ok:false, why:'GSA 규격 네트워크 → 제외 규칙에 걸림'};

    }
    case 'platform': { const ok = sel.includes('p-'+T.platform); return {ok, why:`플랫폼 ${TLAB('platform',T.platform)} ${ok?'일치':'불일치'}`}; }
    case 'client': {
      const id = {'browser':'c-browser','ma-approved':'c-modern','ma-other':'c-modern','eas':'c-eas','legacy':'c-legacy'}[T.client];
      const ok = sel.includes(id); return {ok, why:`클라이언트 ‘${TLAB('client',T.client)}’ ${ok?'일치':'불일치'}`};
    }
    case 'device-filter': {
      const mode = sel.includes('df-include') ? 'df-include' : 'df-exclude', rule = SIM_DF_RULES[simSubOf(mode)] || SIM_DF_RULES['own-ne-company'];
      const unreg = T.device==='personal', hit = rule.hit.includes(T.device);

      return hit ? {ok:false, why:`제외 규칙 ${rule.expr} 에 일치 → 정책에서 제외`} : {ok:true, why: unreg && !rule.neg ? '미등록 디바이스는 속성이 null → 양수 연산자(-eq) 제외 규칙에 걸리지 않아 정책이 적용됨' : `제외 규칙 ${rule.expr} 에 일치하지 않아 정책이 적용됨`};
    }
    case 'device-filter-legacy': {
      if(sel.includes('df-include') && T.device!=='personal') return {ok:false, why:'디바이스 필터 규칙(예: 개인 소유)에 일치하지 않음'};
      if(sel.includes('df-exclude') && T.device==='paw') return {ok:false, why:'제외 규칙(PAW)에 일치 → 정책 제외'};
      return {ok:true, why:'디바이스 필터 규칙 평가 통과'};
    }
    case 'signin-risk': case 'user-risk': { const p = key==='signin-risk'?'sr-':'ur-'; const lv = T[key]; const ok = lv!=='none' && sel.includes(p+lv); return {ok, why:`위험 수준 ‘${TLAB(key,lv)}’ ${ok?'일치':'불일치'}`}; }
    case 'insider-risk': { const lv = T[key]; const ok = lv!=='none' && sel.includes('ir-'+lv); return {ok, why:`내부자 위험 ‘${lv}’ ${ok?'일치':'불일치'}`}; }
    case 'auth-flow': { const ok = (T.flow==='devicecode'&&sel.includes('af-devicecode'))||(T.flow==='transfer'&&sel.includes('af-authtransfer')); return {ok, why:`인증 흐름 ‘${TLAB('flow',T.flow)}’ ${ok?'일치':'불일치'}`}; }
  }
  return {ok:true, why:''};
}
function simGrantSat(c){

    case 'gc-mfa': return {ok:T.mfa!=='none', why: T.mfa!=='none' ? 'MFA 클레임이 이미 있음' : 'MFA 클레임 없음'};
    case 'gc-strength': { const sv = simSubOf('gc-strength'), ok = sv==='phish' ? T.mfa==='phish' : sv==='pwless' ? ['pwless','phish'].includes(T.mfa) : T.mfa!=='none'; const nm = {mfa:'다단계 인증',pwless:'암호 없는 MFA',phish:'피싱 방지 MFA'}[sv]; return {ok, why: ok ? `인증 강도 ‘${nm}’ 충족` : `인증 강도 ‘${nm}’에 해당하는 방법으로 인증되지 않음`}; }
    case 'gc-compliant': { const ok = ['managed','paw'].includes(T.device); return {ok, why:`기기 준수 상태: ${ok?'준수':'비준수·미등록'}`}; }
    case 'gc-hybrid': { const ok = ['managed','hybrid-only','paw'].includes(T.device); return {ok, why:`하이브리드 조인: ${ok?'예':'아니오'}`}; }
    case 'gc-approved-app': { const ok = T.client==='ma-approved'; return {ok, why:`승인된 클라이언트 앱: ${ok?'예':'아니오'}`}; }
    case 'gc-app-protection': { const ok = T.client==='ma-approved'; return {ok, why:`앱 보호 정책 적용 앱: ${ok?'예':'아니오'}`}; }
    case 'gc-pwdchange': return {ok:false, why:'이번 로그인에서 암호 변경 이력 없음'};
    case 'gc-risk-remediation': return {ok:false, why:'위험이 아직 해결(교정)되지 않음'};
    case 'gc-idverify': return {ok:false, why:'신원 확인 이력 없음'};
    case 'gc-tou': { const ok = T.tou==='yes'; return {ok, why:`약관 동의: ${ok?'완료':'미동의'}`}; }

function simCompletable(c){
  const T = SIM.T; if(T.complete!=='yes') return false;
  if(c==='gc-strength'){ const sv = simSubOf('gc-strength'); return sv==='phish' ? T.reg==='phish' : sv==='pwless' ? ['pwless','phish'].includes(T.reg) : T.reg!=='none'; }
  return SIM_INTERACTIVE.has(c);
}
function simSessionEffect(id){
  const T = SIM.T;
  const browserOnly = {'s-mdca':'브라우저 세션에서만 동작','s-persistent':'브라우저 세션에서만 동작'};
  if(browserOnly[id] && T.client!=='browser') return {eff:false, why:`이번 클라이언트(${TLAB('client',T.client)})에서는 효과 없음 — ${browserOnly[id]}`};
  if(id==='s-app-restrictions' && !['t-app','t-app-spo','t-app-other'].includes(T.resource)) return {eff:false, why:'Exchange Online·SharePoint Online 외 리소스에서는 효과 없음'};
  if(id==='s-token-protection' && !(T.platform==='windows' && T.client==='ma-other')) return {eff:false, why:'지원 범위(Windows 네이티브 앱 등) 밖이면 효과가 제한됨 [확인 필요]'};
  return {eff:true, why:''};
}

/* ─── 흐름 생성 + 결과 ─── */
function simGenerate(){
  const S = SIM.S, T = SIM.T, nodes = [], edges = [], shared = {};
  const trace = [], warns = [], grantRows = [], sessRows = [];
  const report = sHas('state','st-report'), off = sHas('state','st-off');
  let seq = 0, tails = [];
  const N = (type,title,sub,narr,actor,ui,data,extra)=>{ const n = Object.assign({id:'n'+(++seq),type,title,sub:sub||'',narr:narr||'',actor:actor||'',ui:ui||'',data:data||''},extra||{}); nodes.push(n); return n; };
  const E = (a,b,label)=>edges.push({from:a.id,to:b.id,label:label||''});
  const chain = n=>{ tails.forEach(t=>E(t.n,n,t.label)); tails = [{n,label:''}]; };
  const sink = (key,mk)=> shared[key] || (shared[key] = mk());
  const sinkNA = ()=>sink('na',()=>N('끝','정책 미적용 — 다음 정책 평가',report?'result: reportOnlyNotApplied':'result: notApplied','이 정책은 이번 로그인에 걸리지 않습니다. 다른 정책의 평가에는 영향이 없습니다.','Entra ID','','appliedConditionalAccessPolicies[].result',{sh:1}));
  const sinkOff = ()=>sink('off',()=>N('끝','정책 평가 안 함',"result: notEnabled",'정책 상태가 ‘사용 안 함’이면 평가하지 않습니다.','Entra ID','','policy.state=disabled',{sh:1}));
  const sinkBlock = ()=>sink('blk',()=> report
      ? N('끝','차단됐을 요청 — 강제 안 함','result: reportOnlyFailure','보고 전용: 사용 상태였다면 차단/미충족이었음을 기록만 하고 접근은 그대로 허용합니다.','Entra ID','','로그인 로그 › 조건부 액세스 탭',{sh:1})
      : N('차단','액세스 차단','result: failure','정책 요구를 채우지 못해 토큰이 발급되지 않고 접근이 거부됩니다.','Entra ID','','로그인 로그 failureReason',{sh:1}));
  const decide = (n,okL,noL,pass,fail)=>{ n.goto = pass?okL:noL; E(n,fail,noL); tails = [{n,label:okL}]; };
  const subSel = id => (sHas(SIM.cat.opts[id]?.group, id) && SIM_SUB_LABEL[id]) ? SIM_SUB_LABEL[id](simSubOf(id)) : '';
  const sub = k => { let t = sLabels(k) || sGf(k,'노드 보조'); if(k==='loc' && sHas('loc','l-selected')) t += ' · '+subSel('l-selected'); if(k==='device-filter'){ const m = sHas('device-filter','df-include')?'df-include':'df-exclude'; if(sHas('device-filter',m)) t += ' · '+subSel(m); } return t; };

  // 시작
  const start = N('시작','로그인 요청',`${PRINC[T.principal]} → ${TLAB('resource',T.resource)}`,`${PRINC[T.principal]}이(가) ‘${TLAB('resource',T.resource)}’에 접근합니다. 위치 ${TLAB('location',T.location)} · 기기 ${TLAB('device',T.device)} · ${TLAB('client',T.client)}.`,'사용자','/authorize 또는 리소스 접근 요청','principal · resource · IP · deviceId · user-agent');
  chain(start);

  // 상태
  const stN = N('판단','정책 상태?',sLabels('state'),(sGf('state','해설')||'정책 상태를 먼저 확인합니다.')+(off?' → 사용 안 함: 평가하지 않음':report?' → 보고 전용: 평가하되 강제하지 않음':' → 사용: 평가하고 강제'),sGf('state','주체')||'Entra ID',sGf('state','위치'),sGf('state','데이터'));
  chain(stN); decide(stN, report?'보고 전용':'사용', '사용 안 함', !off, sinkOff());
  if(off){ trace.push({k:'no',t:'정책이 ‘사용 안 함’이라 평가하지 않습니다.'}); }

  // Phase 1
  const sig = ['위치 IP','디바이스 ID·플랫폼','클라이언트 앱'].concat(sSel('signin-risk').length||sSel('user-risk').length?['ID Protection 위험']:[]).concat(sSel('insider-risk').length?['내부자 위험']:[]).join(' · ');
  const p1 = N('처리','Phase 1 · 세션 정보 수집',sig,'정책을 판정하기 전에 위치·기기·클라이언트·위험 같은 세션 정보를 모읍니다. 사용·보고 전용 정책이 모두 평가됩니다.','Entra ID','','신호: '+sig);
  chain(p1);

  // 할당 · 대상 리소스
  const im = simMatchIdentity();
  const idN = N('판단',sGf('identity','노드 제목')||'대상 ID 일치?',sLabels('identity')+(sSel('identity-exclude').length?` — 제외: ${sLabels('identity-exclude')}`:''),(sGf('identity','해설')||'로그인 주체가 포함 대상이고 제외 대상이 아닌지 확인합니다.')+' → '+im.why,sGf('identity','주체')||'Entra ID',sGf('identity','위치'),sGf('identity','데이터'));
  chain(idN); decide(idN,'일치','불일치',im.ok,sinkNA()); trace.push({k:im.ok?'ok':'no',t:'대상 ID — '+im.why});
  const rm = simMatchResource();
  const rsN = N('판단',sGf('resource','노드 제목')||'대상 리소스 일치?',sLabels('resource')+(sHas('resource','r-authctx')?' · '+subSel('r-authctx'):''),(sGf('resource','해설')||'요청한 리소스·작업이 대상 리소스에 포함되는지 확인합니다.')+' → '+rm.why,sGf('resource','주체')||'Entra ID',sGf('resource','위치'),sGf('resource','데이터'));
  chain(rsN); decide(rsN,'일치','불일치',rm.ok,sinkNA()); trace.push({k:rm.ok?'ok':'no',t:'대상 리소스 — '+rm.why});

  // 조건
  SIM_COND_ORDER.forEach(key=>{
    if(!sSel(key).length) return;
    const cm = simCondMatch(key);
    const unsup = sSel(key).filter(id=>!sSupported(id,T.principal));
    if(unsup.length){ warns.push(`‘${SIM.cat.groups[key]?.title||key}’ 조건은 ${PRINC_KIND[T.principal]}에게는 지원되지 않는 것으로 문서화되어 있습니다 — 이 시뮬레이션은 그대로 평가합니다.`); }
    const g = SIM.cat.groups[key];
    const actor = (key==='loc' && (sHas('loc','l-compliant')||sHas('loc','l-ex-compliant'))) ? 'Entra ID · GSA' : (sGf(key,'주체')||'Entra ID');
    const n = N('판단',sGf(key,'노드 제목')||`${g?.title||key} 일치?`,sub(key),(sGf(key,'해설')||'')+' → '+cm.why,actor,sGf(key,'위치'),sGf(key,'데이터'));
    chain(n); decide(n,'일치','불일치',cm.ok,sinkNA()); trace.push({k:cm.ok?'ok':'no',t:`${g?.title||key} — ${cm.why}`});
  });

  // Phase 2 · 허용
  const block = sHas('grant-mode','g-block');
  const p2 = N('처리','Phase 2 · 허용 컨트롤 평가',block?'액세스 차단':(sLabels('grant-op')||''),'정책이 걸렸다면 이제 액세스 제어를 평가합니다. 차단이 있으면 다른 컨트롤보다 먼저 적용되고, 없으면 허용 컨트롤을 충족했는지 봅니다.','Entra ID','',sGf('grant','평가')||'정책의 grantControls · sessionControls');
  chain(p2);
  let finalEnd = null, prompted = false;
  const controls = SIM_GRANT_ORDER.filter(c=>sHas('grant',c));
  if(block){
    const b = N('차단',sOf('g-block','노드 제목')||'액세스 차단',sOf('g-block','노드 보조')||'Block access',sOf('g-block','해설')||'차단 컨트롤이 걸려 토큰이 발급되지 않습니다. 다른 컨트롤은 평가하지 않습니다.',sOf('g-block','주체')||'Entra ID',sOf('g-block','위치'),sOf('g-block','데이터'));
    if(report){ b.type='끝'; b.title='차단됐을 요청 — 강제 안 함'; b.sub='result: reportOnlyFailure'; }
    chain(b); finalEnd = b;
    sessRows.push({skip:true});
  } else {
    const op = sHas('grant-op','go-or') ? 'or' : 'and';
    if(!controls.length){
      const g0 = N('처리','허용 — 요구 컨트롤 없음','grantControls 없음','선택한 허용 컨트롤이 없어 조건만 일치하면 그대로 다음 단계로 갑니다.','Entra ID','','grantControls=null');
      chain(g0); trace.push({k:'info',t:'허용 컨트롤을 선택하지 않음 — 추가 요구 없이 통과'});
    }
    const judgeNode = c=>{
      const sat = simGrantSat(c), sup = sSupported(c,T.principal);
      if(!sup) warns.push(`‘${sLab(c)}’은(는) ${PRINC_KIND[T.principal]}에게 지원되지 않습니다(문서 기준) — 충족으로 건너뜁니다.`);
      const ok = !sup || sat.ok;
      const n = N('판단',sOf(c,'노드 제목')||`${sLab(c)} 충족?`,(c==='gc-strength'?subSel('gc-strength'):sOf(c,'노드 보조')),(sOf(c,'해설')||'')+' → '+(sup?sat.why:'미지원 주체 — 건너뜀'),sOf(c,'주체')||'Entra ID',sOf(c,'위치'),sOf(c,'데이터'));
      return {n,ok,sat,sup};
    };
    const promptNode = c=>{
      const expr = sOf(c,'표현');
      const n = N('판단',`${(sOf(c,'노드 제목')||sLab(c)).replace(/\s*충족\?$/,'')} 프롬프트 완료?`,'사용자에게 요구 표시',(expr?expr.split(/;\s*/)[0]+' · ':'')+'사용자가 요구를 수행하면 충족으로 처리합니다.','사용자','',sOf(c,'미충족 시'));
      return n;
    };
    const rows = [];
    if(op==='and'){
      controls.forEach(c=>{
        const j = judgeNode(c); chain(j.n);

          const p = promptNode(c), can = simCompletable(c);

          p.goto = can?'완료':'미완료'; E(p,sinkBlock(),'미완료');
          tails = [{n:j.n,label:'충족'},{n:p,label:'완료'}];
          rows.push({c,sat:j.ok,prompt:!j.ok,done:j.ok||can,why:j.sat.why});
        } else {
          decide(j.n,'충족','미충족',j.ok,sinkBlock());
          rows.push({c,sat:j.ok,prompt:false,done:j.ok,why:j.sat.why});
        }
      });
      if(controls.length){ const ok = N('처리','요구 충족 — 모든 컨트롤','AND',  '선택한 모든 컨트롤을 충족했습니다.','Entra ID','','grantControls.operator=AND'); chain(ok); }
    } else {
      const judges = controls.map(c=>judgeNode(c));
      if(judges.length){
        const okN = N('처리','요구 충족 — 하나 이상','OR','선택한 컨트롤 중 하나를 충족하면 이 정책의 요구는 충족된 것으로 봅니다.','Entra ID','','grantControls.operator=OR');
        let prevTail = tails;
        judges.forEach(j=>{ prevTail.forEach(t=>E(t.n,j.n,t.label)); E(j.n,okN,'충족'); j.n.goto = j.ok?'충족':'미충족'; prevTail = [{n:j.n,label:'미충족'}]; });
        const firstInter = controls.find(c=>SIM_INTERACTIVE.has(c));
        if(firstInter){
          const p = promptNode(firstInter), can = simCompletable(firstInter);
          prevTail.forEach(t=>E(t.n,p,t.label)); p.goto = can?'완료':'미완료'; E(p,sinkBlock(),'미완료'); E(p,okN,'완료');
        } else { prevTail.forEach(t=>E(t.n,sinkBlock(),t.label)); }
        tails = [{n:okN,label:''}];
        const k = judges.findIndex(j=>j.ok);
        controls.forEach((c,i)=>rows.push({c,sat:judges[i].ok,prompt:false,done:k>=0,why:judges[i].sat.why,skipped:k>=0&&i>k,or:true}));
        if(k<0 && firstInter){ const r = rows.find(x=>x.c===firstInter); r.prompt = true; r.done = simCompletable(firstInter); }
      }
    }
    rows.forEach(r=>grantRows.push(r));

    // 세션
    SIM_SESSION_ORDER.filter(id=>sHas('session',id)).forEach(id=>{
      const eff = simSessionEffect(id);
      const n = N('처리',sOf(id,'노드 제목')||sLab(id),(subSel(id)||sOf(id,'노드 보조')),(sOf(id,'해설')||'')+(eff.eff?'':' → '+eff.why),sOf(id,'주체')||'Entra ID',sOf(id,'위치'),sOf(id,'데이터'));

  SIM.l3.l4 = [l4]; st.l4 = 0;
  renderSimPanel(); renderSimDetail(); renderSimResult();
  buildStage();
}

      D(['r-authctx','r-gsa-internet','r-gsa-m365','r-gsa-private'],'에이전트 ID 정책의 대상 리소스는 에이전트 리소스 · 모든 리소스 · 선택한 리소스입니다 (문서 기준)');

  if(res.startsWith('r-ua-')) D(['st-report'],'사용자 작업 범위는 보고 전용으로 평가할 수 없습니다 (문서 기준)');
  if(res==='r-gsa-private') D(['l-compliant','l-ex-compliant'],'규격 네트워크 검사는 Private Access 앱에 지원되지 않습니다 (문서 기준)');
  if(res!=='r-apps-all') D(['s-persistent'],'영구 브라우저 세션은 대상 리소스가 ‘모든 리소스’일 때만 사용할 수 있습니다 (문서 기준)');
  if(res!=='r-gsa-internet') D(['s-gsa-profile'],'Global Secure Access 보안 프로필은 ‘Global Secure Access: 인터넷 트래픽’ 리소스에서 사용합니다');
  if(!['r-apps-all','r-apps-selected'].includes(res)){
    D(['s-token-protection'],'토큰 보호는 대상 리소스가 앱일 때만 의미가 있습니다 (지원 앱 목록 한정)');
    D(['s-app-restrictions'],'앱 적용 제한은 Exchange Online · SharePoint Online 앱에만 적용됩니다');
  }
  if(!sSel('user-risk').length){
    D(['gc-pwdchange'],'암호 변경 필요는 ‘사용자 위험’ 조건과 함께 쓰는 컨트롤입니다 — ③ 조건에서 사용자 위험을 먼저 고르세요');

  const idsel = sSel('identity');

  if(!block && grants.length && grants.every(g=>['gc-approved-app','gc-app-protection'].includes(g)) && (grants.length===1 || op==='and'))
    D(['p-macos','p-linux'],'승인된 앱·앱 보호 정책이 단독이거나 ‘모두 필요’일 때는 macOS·Linux 플랫폼을 쓸 수 없습니다 (문서 기준)');
  if(sSel('signin-risk').length){ rec['gc-mfa'] = '로그인 위험 조건의 해결 수단'; rec['gc-strength'] = '로그인 위험 조건의 해결 수단'; }
  if(sSel('user-risk').length){ rec['gc-risk-remediation'] = '사용자 위험 조건의 해결 수단'; rec['gc-pwdchange'] = '사용자 위험 조건의 해결 수단'; }
  if(res==='r-gsa-internet') rec['s-gsa-profile'] = '인터넷 트래픽 리소스에 연결하는 세션 컨트롤';
  if(sHas('loc','l-compliant')||sHas('loc','l-ex-compliant')) note('loc','규격 네트워크는 Global Secure Access가 평가합니다. GSA › 설정 › 세션 관리 › 적응형 액세스에서 조건부 액세스 신호를 켜야 합니다.');
  if(sHas('client','c-eas')) note('client','Exchange ActiveSync 클라이언트 조건은 사용자·그룹 할당에서, 대상 앱을 Exchange Online으로 둘 때 지원됩니다 (문서 기준).');
  if(sHas('client','c-legacy')||sHas('client','c-eas')) note('client','레거시 인증 클라이언트는 MFA·디바이스 상태를 전달하지 못해 대부분 차단 정책의 대상이 됩니다.');
  if(sSel('user-risk').length && sSel('signin-risk').length) note('signin-risk','사용자 위험과 로그인 위험은 서로 다른 정책으로 나눠 구성하는 것이 일반적입니다 [확인 필요].');
  if(block && idt==='users' && sHas('identity','u-all') && !sSel('identity-exclude').length) note('identity-exclude','모든 사용자를 대상으로 차단하려면 비상 접근 계정을 반드시 제외하세요.');
  if(grants.includes('gc-mfa') && grants.includes('gc-strength')) note('grant','MFA 필요와 인증 강도는 함께 쓸 수 없습니다 — 인증 강도가 MFA를 포함합니다.');
  if(grants.includes('gc-pwdchange') && grants.length>1) note('grant','암호 변경 필요는 다른 컨트롤과 함께 쓸 수 없습니다 (문서 기준).');
  return {dis,rec,notes};
}
function simReconcile(){
  const out = SIM.notices; let guard = 0, changed = true;
  const idt = simIdType();
  while(changed && guard++<8){
    changed = false;
    const R = simRules();
    if(idt!=='users' && !sHas('grant-mode','g-block')){ SIM.S['grant-mode'] = ['g-block']; out.push(`‘액세스 허용’ → ‘액세스 차단’ : ${R.dis['g-grant']}`); changed = true; continue; }
    for(const g of SIM.l3.sim.groups){
      const cur = SIM.S[g.key]||[], bad = cur.filter(id=>R.dis[id]); if(!bad.length) continue;
      bad.forEach(id=>out.push(`‘${sLab(id)}’ 해제 : ${R.dis[id]}`));
      if(g.key==='resource') SIM.S.resource = ['r-apps-all']; else if(g.key==='state') SIM.S.state = ['st-on']; else SIM.S[g.key] = cur.filter(id=>!R.dis[id]);
      changed = true;
    }
  }
  Object.entries(SIM_SUBS).forEach(([oid,d])=>{ if(d.dis && d.dis(simSubOf(oid))){ const f = d.items.find(x=>!d.dis(x[0])); SIM.sub[oid] = f[0]; out.push(`${d.label} → ‘${f[1]}’ : ${d.dis(simSubOf(oid)) || '선택할 수 없는 값'}`); } });
  SIM.notices = out.slice(0,6);
  simSyncTest();
}

function simDerivedSet(){
  const d = new Set(['principal']);
  if(sSel('loc').length) d.add('location');
  if(sSel('platform').length) d.add('platform');
  if(sSel('client').length) d.add('client');
  if(sSel('signin-risk').length) d.add('signin-risk');
  if(sSel('user-risk').length) d.add('user-risk');
  if(sSel('insider-risk').length) d.add('insider-risk');
  if(sSel('auth-flow').length) d.add('flow');
  if(sSel('device-filter').length) d.add('device');
  if(!['r-apps-all','r-apps-selected'].includes(sSel('resource')[0])) d.add('resource');
  return d;

function simDeriveValue(k){
  const T = SIM.T, pick = (ids,map)=>{ const f = ids.find(i=>sHas(i.g,i.id)); return f ? map[f.id] : undefined; };
  switch(k){

  h += row('② 대상 리소스',chips(ids('resource')));
  const conds = SIM_COND_ORDER.filter(k=>sSel(k).length);
  h += row('③ 조건',conds.length ? conds.map(k=>`<div class="kv"><b>${esc2(gTitle(k))}</b>${chips(ids(k),/^l-ex|^x-/.test(sSel(k)[0])?'ex':'')}</div>`).join('') : '<i class="none">없음 — 모든 로그인에 적용</i>');
  h += row('④ 허용',block ? `<div class="kv">${chips(['액세스 차단'],'bad')}</div>` : (sSel('grant').length ? `<div class="kv">${chips(ids('grant'))}</div>` + (sSel('grant').length>1 ? `<div class="kv"><b>결합</b>${chips([sLabels('grant-op')])}</div>` : '') : '<i class="none">추가 요구 없음</i>'));
  h += row('⑤ 세션',chips(ids('session')));
  h += `</div>`;

  const keys = SIM_TESTS.map(t=>t.k).filter(simRelevant);
  h += `<div class="sumcard"><div class="sch-h"><b>🧪 테스트 로그인</b><span class="stchip">${SIM.autoTest?'정책에서 자동 구성':'수동'}</span></div>`;
  h += `<div class="trows">` + keys.map(k=>{
    const t = SIM_TESTS.find(x=>x.k===k), src = simTestSource(k), v = SIM.T[k];
    const lab = (k==='resource' && SIM.autoTest && !simDerivedSet().has('resource')) ? '접근 앱' : t.label;
    return `<div class="trow"><span>${esc2(lab)}</span><b>${esc2(TLAB(k,v))}</b><em class="src ${src==='정책'?'pol':src==='입력'?'inp':src==='시나리오'?'scn':'man'}">${src}</em></div>`;
  }).join('') + `</div><div class="sumnote">왼쪽에서 정한 조건이 그대로 반영됩니다. <em class="src pol">정책</em> 정책에서 가져온 값 · <em class="src inp">입력</em> 왼쪽 ⑦에서 고른 값</div></div>`;
  return h;
}
function renderSimPanel(){
  const box = $('#simPanel'); if(!box){ closePop(); return; }
  let h = `<div class="sim-grid"><div class="sim-policy">`;
  if(SIM.notices.length) h += `<div class="autonote"><div class="at"><b>🔄 선택에 맞춰 자동으로 조정했습니다</b><button type="button" id="noteX" title="닫기">✕</button></div><ul>${SIM.notices.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  h += `<div class="sec"><div class="sh"><b>예시 정책</b><small>고르면 아래 설정이 채워집니다</small></div><div class="fgrid">${simField('preset')}</div></div>`;
  SIM_FIELD_SECTIONS.forEach(sec=>{
    const fs = sec.fields.flatMap(simFieldsFor);
    h += `<div class="sec"><div class="sh"><b>${sec.no} ${sec.title}</b><small>${sec.hint}</small></div>`;
    if(sec.title==='액세스 제어 › 허용' && sHas('grant-mode','g-block')) h += `<div class="note-b">‘액세스 차단’을 고르면 허용 컨트롤은 평가하지 않습니다. 컨트롤을 요구하려면 ‘액세스 허용’을 고르세요.</div>`;
    if(sec.title==='할당' && simIdType()!=='users') h += `<div class="note-b">${simIdType()==='workload'?'워크로드 ID 정책은 위치 조건(과 서비스 주체 위험)과 ‘액세스 차단’만 사용할 수 있습니다 (문서 기준).':'에이전트 ID 정책은 에이전트 위험 조건(미리 보기)과 ‘액세스 차단’만 사용할 수 있습니다 (문서 기준).'}</div>`;
    h += `<div class="fgrid">${fs.join('')}</div></div>`;
  });
  const ins = simInputKeys().map(k=>simField('t:'+k)).filter(Boolean);
  h += `<div class="sec"><div class="sh"><b>⑦ 로그인 상황</b><small>${SIM.autoTest?'정책이 정하지 않는 신호 · 이 값으로 평가':'모든 신호를 직접 지정'}</small></div>`;
  h += ins.length ? `<div class="fgrid">${ins.join('')}</div>` : `<div class="note-b">추가로 고를 상황이 없습니다. 정책이 정한 신호만으로 평가합니다.</div>`;
  h += `<button type="button" class="tgl" id="tglAuto">${SIM.autoTest?'테스트 로그인을 직접 지정하기 (정책과 다른 로그인으로 평가)':'정책에서 자동으로 가져오기'}</button></div>`;
  h += `</div><div class="sim-sum">${renderSimSummary()}</div></div>`;
  box.innerHTML = h;
  box.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{ if(SIM.pop && SIM.pop.fid===b.dataset.f) closePop(); else openPop(b.dataset.f,false); });
  box.querySelectorAll('.cb').forEach(b=>b.onkeydown=e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); openPop(b.dataset.f,true); } });
  box.querySelectorAll('.fl[data-g]').forEach(b=>b.onclick=()=>{ SIM.detail = {g:b.dataset.g}; renderSimDetail(); });
  const nx = $('#noteX'); if(nx) nx.onclick = ()=>{ SIM.notices = []; renderSimPanel(); };
  const ta = $('#tglAuto'); if(ta) ta.onclick = ()=>{ SIM.autoTest = !SIM.autoTest; if(SIM.autoTest) simSyncTest(); simRefresh(); };
  if(SIM.pop) renderPop();
}
function simToggle(g,o){
  SIM.notices = [];
  const d = simDef(g); if(d && d.pick) d.pick(o); else SIM.S[g] = [o];
  SIM.presetName = ''; simReconcile(); simRefresh();
}


/* 딥링크: ?f=기능제목일부&l3=번호&l4=번호&route=번호&play=1 · 시뮬레이터: &p=예시번호&d=그룹:옵션&o=열어 둘 드롭다운 필드 */
(function initFromQuery(){
  const q = new URLSearchParams(location.search);
  const f = q.get('f');
  if(f){
    for(const [i,j] of FLAT){ if(DATA[i].l2[j].title.includes(f)){ Object.assign(st,{l1:i,l2:j}); open[i]=true; break; } }
    const l2 = curL2();
    st.l3 = Math.min(+(q.get('l3')||0), Math.max(0,l2.l3.length-1));
    st.l4 = l2.l3.length ? Math.min(+(q.get('l4')||0), l2.l3[st.l3].l4.length-1) : 0;
    st.route = +(q.get('route')||0);
  }
  renderBlade(); renderCenter();
  const l3q = curL2().l3[st.l3];
  if(l3q && l3q.sim){
    if(q.get('p')!==null){ simApplyPreset(l3q.sim.presets[+q.get('p')]||l3q.sim.presets[0]); }
    if(q.get('d')){ const [g,o] = q.get('d').split(':'); SIM.detail = {g,o:o||null}; if(SIM.cat.groups[g]) SIM.openG.add(g); }
    if(q.get('p')!==null || q.get('d')) simRefresh();
    if(q.get('o')) openPop(q.get('o'),false);
  }
  if(q.get('play')) playCurrent();
  if(q.get('node') && view && view.byId[q.get('node')]){ pinNode(q.get('node')); openNodeDetail(q.get('node')); }
})();
}
</script>
